name: "[DEVELOP] Build e PR"

on:
  push:
    branches:
      - develop

jobs: 
  terraform-init-check:
    name: "Terraform init e fmt (check)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: $TF_VERSION

      - name: Terraform init
        working-directory: infra/
        run: terraform init -backend=false

      - name: Terraform fmt (check)
        run: |
          terraform fmt -check -recursive infra/

      - name: Terraform validate
        working-directory: infra/
        run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        working-directory: infra/
        run: terraform plan -no-color -out=tfplan

  terraform-apply:
    runs-on: ubuntu-latest
    needs: terraform-init-check
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'develop' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: $TF_VERSION

      - name: Definir Workspace
        run: |
          branch="${GITHUB_REF##*/}"
          if [ "$branch" = "main" ]; then
            echo "TF_WORKSPACE=${{ secrets.HCP_WORKSPACE_PRD }}" >> $GITHUB_ENV
          else
            echo "TF_WORKSPACE=${{ secrets.HCP_WORKSPACE_DEV }}" >> $GITHUB_ENV
          fi

      - name: Configurar credenciais HCP Terraform (automático)
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          # Cria diretório de credenciais se não existir
          mkdir -p ~/.terraform.d
          
          # Configura token automaticamente sem interação
          cat > ~/.terraform.d/credentials.tfrc.json <<EOF
          {
            "credentials": {
              "app.terraform.io": {
                "token": "$TF_TOKEN_app_terraform_io"
              }
            }
          }
          EOF
          echo "✓ Credenciais do HCP Terraform configuradas automaticamente"

      - name: Terraform init (backend HCP)
        working-directory: infra/
        run: terraform init

      - name: Selecionar workspace
        working-directory: infra/
        run: terraform workspace select $TF_WORKSPACE

      - name: Aplicar plano Terraform
        working-directory: infra/
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: terraform apply -auto-approve

  pull-request:
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - name: Verificar código
        uses: actions/checkout@v3

      - name: Instalar GitHub CLI
        run: sudo apt-get install -y gh

      - name: Autenticar com GitHub CLI
        run: echo "${{ secrets.GH_TOKEN }}" | gh auth login --with-token

      - name: Obter nome da branch atual
        run: echo "BRANCH_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Verificar branch 'main'
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

          if ! git ls-remote --exit-code --heads origin main; then
            echo "Branch 'main' não encontrada. Criando..."
            git checkout --orphan main
            git commit --allow-empty -m "Initial commit on main"
            git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }} main
          else
            echo "Branch 'main' já existe."
          fi

      - name: Enviar branch de feature para main
        run: git push origin $BRANCH_NAME

      - name: Criar pull request se necessário
        run: |
          git fetch origin main
          git checkout $BRANCH_NAME
          
          git merge origin/main --no-ff --no-commit || true

          EXISTING=$(gh pr list --head $BRANCH_NAME --base main --state open --json number --jq '.[].number')
          if [ -z "$EXISTING" ]; then
            echo "Nenhum PR aberto encontrado. Criando PR..."
            
            if [ $(git diff --stat) != '' ]; then
              git commit -m "Merge main into $BRANCH_NAME"
              git push origin $BRANCH_NAME
            fi

            gh pr create --base main --head $BRANCH_NAME --title "Merge main <-- $BRANCH_NAME" --body "Pull request automático"
          else
            echo "PR já existe: #$EXISTING. Novo commit já foi adicionado ao PR."
          fi

permissions:
  contents: write
  pull-requests: write

