name: "Terraform Apply no HCP Terraform"

on:
  push:
    branches:
      - develop
      - main

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    needs: terraform-check

    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Definir variáveis de ambiente HCP Terraform
        run: |
          if [ "${GITHUB_REF##*/}" == "develop" ]; then
            echo "TF_WORKSPACE=${{ secrets.HCP_WORKSPACE_DEV }}" >> $GITHUB_ENV
          else
            echo "TF_WORKSPACE=${{ secrets.HCP_WORKSPACE_PRD }}" >> $GITHUB_ENV
          fi

      - name: Autenticar no HCP Terraform
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          echo "Autenticando no HCP Terraform..."
          terraform login || true

      - name: Inicializar Terraform com backend HCP
        working-directory: infra/
        run: terraform init

      - name: Selecionar workspace correto
        working-directory: infra/
        run: terraform workspace select $TF_WORKSPACE || terraform workspace new $TF_WORKSPACE

      - name: Aplicar plano Terraform
        working-directory: infra/
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: terraform apply -auto-approve
