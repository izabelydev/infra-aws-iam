name: "Terraform Apply HCP Terraform"

on:
  push:
    branches:
      - develop
      - main

jobs:
  terraform-init-check:
    runs-on: ubuntu-latest
    needs: terraform-check
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'develop' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ var.TF_VERSION }}

      - name: Definir Workspace
        run: |
          branch="${GITHUB_REF##*/}"
          if [ "$branch" = "main" ]; then
            echo "TF_WORKSPACE=${{ secrets.HCP_WORKSPACE_PRD }}" >> $GITHUB_ENV
          else
            echo "TF_WORKSPACE=${{ secrets.HCP_WORKSPACE_DEV }}" >> $GITHUB_ENV
          fi

      - name: Autenticar no HCP Terraform
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: terraform login || true

      - name: Terraform init (backend HCP)
        working-directory: infra/
        run: terraform init

      - name: Selecionar workspace
        working-directory: infra/
        run: terraform workspace select $TF_WORKSPACE

      - name: Aplicar plano Terraform
        working-directory: infra/
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: terraform apply -auto-approve
